<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry  Mock Exam</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

#time{
    background:orange;
    color:white;
    font-size:30px;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

#question-number{
    font-size:22px;
    margin-bottom:10px;
}

#progress{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

#progress-bar{
    width:0%;
    height:100%;
    background:green;
}

#question{
    font-size:24px;
    margin-bottom:20px;
}

.option{
    background:white;
    padding:15px;
    margin:10px auto;
    max-width:600px;
    text-align:left;
    border-radius:8px;
}

.option label{
    cursor:pointer;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#1565c0;
    color:white;
    font-size:18px;
}

button:hover{
    background:#0d47a1;
}

</style>

</head>

<body>

<h1>Chemistry Mock Exam</h1>

<div id="time">Time Left: 120:00</div>

<h2 id="question-number">Question 1</h2>

<div id="progress">
    <div id="progress-bar"></div>
</div>

<div id="question"></div>

<div id="options"></div>

<button onclick="previousQuestion()">Back</button>

<button onclick="nextQuestion()">Next</button>

<script src="chemistry.js"></script>

</body>
</html>
